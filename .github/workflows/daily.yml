name: Dados diários (Tesouro)
on:
  schedule:
    - cron: "30 10,21 * * 1-5"   # 07:30 e 18:30 BRT, dias úteis
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas
      - run: python scripts/daily.py
      - name: Commit
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add data/tesouro.json
          git diff --cached --quiet || git commit -m "dados: tesouro $(date -u +%F)"
          git push
